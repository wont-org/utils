name: Deploy gh-pages
on:
  push:
    branches:
      - master
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 不使用 github-pages 环境，因为它依赖可能有问题的 actions
    permissions:
      contents: write # 允许推送到 gh-pages 分支
    steps:
      - name: set node version
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false # 使用 JamesIves 部署时需要

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: cache node_modules
        id: node_modules_cache_id
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: install
        if: steps.node_modules_cache_id.outputs.cache-hit != 'true'
        run: pnpm install

      # - name: eslint
      #   run: npm run eslint

      - name: coverage
        run: pnpm run coverage

      - name: build:docs
        run: pnpm run build:docs

      - name: moveCoverage
        run: sh ./scripts/mv-coverage.sh

      # 使用稳定的旧版本 JamesIves 部署 action
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: ./docs/.vuepress/dist
          CLEAN: true
